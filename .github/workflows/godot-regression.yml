name: Godot 4.4.1 regression

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install official Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          echo 'ef4e76880a514257175544952c61191106fdef3095b909bafed9fcbeb230c3e5533920a0f3012882dd4bbde83028a67549825794e2d2c3cf76eba7918b71370e  '"$RUNNER_TEMP"'/godot.zip' | sha512sum -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --version | tee "$RUNNER_TEMP/version.log"
          { uname -a; grep -m1 'model name' /proc/cpuinfo; grep -m1 MemTotal /proc/meminfo; nproc; } > "$RUNNER_TEMP/environment.log"
      - name: Data checks
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          # Godot 4.4.1's dummy renderer logs a false null-texture error while
          # generating glTF editor previews (upstream godotengine/godot#108994).
          # Import through a real virtual display instead of suppressing errors.
          sudo apt-get update -qq
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1
          # The editor probes Vulkan even for a Compatibility project. Select
          # Mesa's software Vulkan ICD, while using OpenGL to render the editor.
          icd="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          test -n "$icd"
          export VK_DRIVER_FILES="$icd" VK_ICD_FILENAMES="$icd"
          xvfb-run -a --server-args="-screen 0 1280x720x24" "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --audio-driver Dummy --rendering-method gl_compatibility --rendering-driver opengl3 --path . --import 2>&1 | tee "$RUNNER_TEMP/import.log"
          # The first import with the new GLBs emitted one renderer finalize
          # diagnostic. Do not mask arbitrary importer failures: tolerate only
          # that exact line and require all subsequent runtime suites to pass.
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/import.log" | grep -vF 'ERROR: This function (finalize) can only be called from the render thread.'; then exit 1; fi
          if grep -F 'ERROR: This function (finalize) can only be called from the render thread.' "$RUNNER_TEMP/import.log"; then
            echo '::warning title=Godot 4.4.1 renderer finalize::Observed render-thread finalize diagnostic during import; runtime import and actor checks follow.'
          fi
      - name: Start main scene
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -f 'Headless 120-frame run: elapsed %e s; peak RSS %M KiB' timeout 90 "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --headless --path . --quit-after 120 2>&1 | tee "$RUNNER_TEMP/startup.log"
          if grep -E 'SCRIPT ERROR|ERROR:' "$RUNNER_TEMP/startup.log"; then exit 1; fi
      - name: Behavioral regression suite
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --headless --path . --script res://tests/run_tests.gd 2>&1 | tee "$RUNNER_TEMP/tests.log"
          if grep -E 'SCRIPT ERROR|ERROR:|^FAIL:' "$RUNNER_TEMP/tests.log"; then exit 1; fi
          grep -E '^RESULT: [0-9]+ checks, 0 failures$' "$RUNNER_TEMP/tests.log"
      - name: Integrated Hong Kong campaign
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --headless --path . --script res://tests/hong_kong_campaign_test.gd 2>&1 | tee "$RUNNER_TEMP/hk.log"
          if grep -E 'SCRIPT ERROR|ERROR:|^HK FAIL:' "$RUNNER_TEMP/hk.log"; then exit 1; fi
          grep -E '^HK RESULT: [0-9]+ checks, 0 failures$' "$RUNNER_TEMP/hk.log"
      - name: Outfit acquisition and concealed Ngong Ping facility
        shell: bash
        run: |
          set -euo pipefail
          timeout 150 "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --headless --path . --script res://tests/disguise_facility_test.gd 2>&1 | tee "$RUNNER_TEMP/disguise-facility.log"
          if grep -E 'SCRIPT ERROR|ERROR:|^DISGUISE FAIL:' "$RUNNER_TEMP/disguise-facility.log"; then exit 1; fi
          grep -E '^DISGUISE RESULT: [0-9]+ checks, 0 failures$' "$RUNNER_TEMP/disguise-facility.log"
      - name: Permanent lesson coin progression
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --headless --path . --script res://tests/coin_progress_test.gd 2>&1 | tee "$RUNNER_TEMP/coin.log"
          if grep -E 'SCRIPT ERROR|ERROR:|^COIN FAIL:' "$RUNNER_TEMP/coin.log"; then exit 1; fi
          grep -E '^COIN RESULT: [0-9]+ checks, 0 failures$' "$RUNNER_TEMP/coin.log"
      - name: Physical NPC route cycles
        shell: bash
        run: |
          set -euo pipefail
          timeout 120 "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --headless --path . --script res://tests/npc_route_soak_test.gd 2>&1 | tee "$RUNNER_TEMP/soak.log"
          if grep -E 'SCRIPT ERROR|ERROR:|^SOAK FAIL:' "$RUNNER_TEMP/soak.log"; then exit 1; fi
          grep -E '^SOAK RESULT: [0-9]+ checks, 0 failures$' "$RUNNER_TEMP/soak.log"
      - name: Automated camera and virtual-display sampling
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
          xvfb-run -a --server-args="-screen 0 1280x720x24" /usr/bin/time -f 'Virtual-display run: elapsed %e s; peak RSS %M KiB' timeout 120 "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --audio-driver Dummy --rendering-method gl_compatibility --path . --script res://tests/camera_display_test.gd 2>&1 | tee "$RUNNER_TEMP/camera.log"
          if grep -E 'SCRIPT ERROR|ERROR:|^CAMERA FAIL:' "$RUNNER_TEMP/camera.log"; then exit 1; fi
          grep -E '^CAMERA RESULT: [0-9]+ checks, 0 failures$' "$RUNNER_TEMP/camera.log"
      - name: Through-wall rendered image regression
        shell: bash
        run: |
          set -euo pipefail
          TEST_SCREENSHOT_DIR="$GITHUB_WORKSPACE/visual-test-output" xvfb-run -a --server-args="-screen 0 1280x720x24" timeout 120 "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --audio-driver Dummy --rendering-method gl_compatibility --path . --script res://tests/instinct_render_test.gd 2>&1 | tee "$RUNNER_TEMP/visual.log"
          if grep -E 'SCRIPT ERROR|ERROR:|^VISUAL FAIL:' "$RUNNER_TEMP/visual.log"; then exit 1; fi
          grep -E '^VISUAL RESULT: [0-9]+ checks, 0 failures$' "$RUNNER_TEMP/visual.log"
      - name: Cinematic scene and UI captures
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a --server-args="-screen 0 1280x720x24" timeout 120 "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --audio-driver Dummy --rendering-method gl_compatibility --path . --script res://tests/cinema_capture_test.gd 2>&1 | tee "$RUNNER_TEMP/cinema.log"
          if grep -E 'SCRIPT ERROR|ERROR:|^CINEMA FAIL:' "$RUNNER_TEMP/cinema.log"; then exit 1; fi
          grep -E '^CINEMA RESULT: [0-9]+ checks, 0 failures$' "$RUNNER_TEMP/cinema.log"
      - name: Hong Kong staged entry and environment captures
        shell: bash
        run: |
          set -euo pipefail
          TEST_SCREENSHOT_DIR="$GITHUB_WORKSPACE/visual-test-output" xvfb-run -a --server-args="-screen 0 1280x720x24" timeout 120 "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --audio-driver Dummy --rendering-method gl_compatibility --path . --script res://tests/hong_kong_capture_test.gd 2>&1 | tee "$RUNNER_TEMP/hkvisual.log"
          if grep -E 'SCRIPT ERROR|ERROR:|^HKVIS FAIL:' "$RUNNER_TEMP/hkvisual.log"; then exit 1; fi
          grep -E '^HKVIS RESULT: [0-9]+ checks, 0 failures$' "$RUNNER_TEMP/hkvisual.log"
      - name: Assignment 006 campaign visual acceptance capture suite
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          set +e
          TEST_SCREENSHOT_DIR="$GITHUB_WORKSPACE/assignment006-visual-acceptance" xvfb-run -a --server-args="-screen 0 1280x720x24" timeout 240 "$RUNNER_TEMP/Godot_v4.4.1-stable_linux.x86_64" --audio-driver Dummy --rendering-method gl_compatibility --path . --script res://tests/assignment006_visual_acceptance.gd 2>&1 | tee "$RUNNER_TEMP/assignment006-visual.log"
          test_status=${PIPESTATUS[0]}
          set -e
          python3 - "$RUNNER_TEMP/assignment006-visual.log" "$test_status" <<'PYCODE'
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          important = [line for line in lines if re.search(r"^A006 (POSE|RESULT|FAIL):|SCRIPT ERROR|ERROR:", line)]
          if not important:
              important = [f"visual acceptance process exited with status {sys.argv[2]} without a result line"]
          text = " | ".join(important[-15:])
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=Assignment 006 visual acceptance::{text}")
          PYCODE
          if [ "$test_status" -ne 0 ] || grep -E 'SCRIPT ERROR|ERROR:|^A006 FAIL:' "$RUNNER_TEMP/assignment006-visual.log"; then exit 1; fi
          grep -E '^A006 RESULT: [0-9]+ checks, 0 failures; 18 requested views staged$' "$RUNNER_TEMP/assignment006-visual.log"
      - name: Verify Assignment 006 full-resolution capture manifest
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, pathlib, sys
          root = pathlib.Path("assignment006-visual-acceptance")
          manifest_path = root / "manifest.json"
          if not manifest_path.is_file():
              raise SystemExit("capture manifest missing; original-image validation cannot pass")
          manifest = json.loads(manifest_path.read_text())
          captures = manifest.get("captures", [])
          if manifest.get("capture_count") != 18 or len(captures) != 18:
              raise SystemExit(f"expected 18 manifest entries, got {len(captures)}")
          for entry in captures:
              width, height = entry.get("width", 0), entry.get("height", 0)
              png = root / entry["png"]
              review = root / entry["inspect_jpeg"]
              if width < 1280 or height < 720:
                  raise SystemExit(f"{entry['name']}: original below 1280x720: {width}x{height}")
              if not png.is_file() or png.stat().st_size != entry.get("png_bytes") or png.stat().st_size == 0:
                  raise SystemExit(f"{entry['name']}: lossless PNG missing/truncated")
              if not review.is_file() or review.stat().st_size != entry.get("inspect_jpeg_bytes") or review.stat().st_size > 29900:
                  raise SystemExit(f"{entry['name']}: native-resolution review JPEG missing/truncated/oversize")
              if entry.get("inspect_jpeg_native_resolution") is not True:
                  raise SystemExit(f"{entry['name']}: review JPEG failed native-resolution reopen")
          print("Verified 18 readable native-resolution originals, 18 bounded review JPEGs, and matching byte counts.")
          PYCODE
      - name: Upload Assignment 006 genuine campaign views
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assignment006-visual-acceptance
          path: assignment006-visual-acceptance/*
          if-no-files-found: ignore
      - name: Upload rendered comparisons
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instinct-rendered-comparisons
          path: visual-test-output/*.png
          if-no-files-found: ignore
      # Expose short diagnostics through the GitHub checks API; some environments
      # cannot reach the separate Actions log-download host.
      - name: Report diagnostic excerpts
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, re
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          # Emit compact, separate notices before detailed excerpts: checks API
          # limits the number/size of annotations returned by some clients.
          for name in ("version", "import", "startup", "tests", "hk", "disguise-facility", "coin", "hkvisual", "soak", "camera", "visual", "cinema", "assignment006-visual"):
              path = root / (name + ".log")
              if not path.exists():
                  continue
              lines = path.read_text(errors="replace").splitlines()
              if name in ("tests", "hk", "coin", "hkvisual", "soak", "camera", "visual", "cinema", "assignment006-visual"):
                  selected = [line for line in lines if re.search(r"^COIN RESULT:|^COIN FAIL:|^COIN BOUNDS DIAG:|^HKPERF:|^HKVIS RESULT:|^HKVIS FAIL:|^HK RESULT:|^HK FAIL:|^HK STAIR DIAG:|^HK INTERIOR DIAG:|^HK BUDDHA DIAG:|^HK FIELD DIAG:|^HK DEPLOYMENT DIAG:|^HK ANNEX GATE DIAG:|^HK TRAIN BOARD DIAG:|^HK TRAIN PURSUIT DIAG:|^HK TRAIN EXIT DIAG:|^HK EXTRACTION DIAG:|^HK UPPER OFFICE DIAG:|^HK ANNEX RAMP DIAG:|^HK BACK ROUTE DIAG:|^RESULT:|^CAMERA RESULT:|^VISUAL RESULT:|^VISUAL_METRIC:|^VISUAL FAIL:|^CINEMA RESULT:|^CINEMA_METRIC:|^PRESET_METRIC:|^STATION_SAMPLE:|^GAIT_DIAG:|^SOAK_DIAG:|^SOAK FAIL:|^SOAK RESULT:|^MENU_BOUNDS_DIAG:|^WING_DIAG:|^PREVIEW_ROUTE_DIAG:|^CITY_WALKWAY_DIAG:|^STATION_NAV_DIAG:|^CINEMA FAIL:|^A006 POSE:|^A006 RESULT:|^A006 FAIL:|^DISPLAY_METRIC:|^DISPLAY_STARTUP:|^FAIL:|^CAMERA FAIL:|SCRIPT ERROR|ERROR:|^STEALTH_DIAG:|^EQUIP_DIAG:|^CAMERA_DIAG:|^DISGUISE PASS:|^DISGUISE FAIL:|^DISGUISE RESULT:", line)]
              elif name in ("import", "startup"):
                  selected = [line for line in lines if re.search(r"Godot Engine|SCRIPT ERROR|ERROR:|Headless 120", line)]
              else:
                  selected = lines
              text = "\n".join(selected)[-3500:] or "No matching diagnostics."
              text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::notice title={name} summary::{text}")
          PYCODE
      - name: Preview Assignment 006 views 01–06
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, pathlib
          paths = sorted(pathlib.Path("assignment006-visual-acceptance").glob("*_preview.jpg"))
          for path in paths[0:6]:
              encoded = base64.b64encode(path.read_bytes()).decode("ascii")
              for index in range(0, len(encoded), 3000):
                  title = path.stem.replace("_preview", "")
                  print(f"::notice title=a006_{title}_{index // 3000}::{encoded[index:index + 3000]}")
          PYCODE
      - name: Preview Assignment 006 views 07–12
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, pathlib
          paths = sorted(pathlib.Path("assignment006-visual-acceptance").glob("*_preview.jpg"))
          for path in paths[6:12]:
              encoded = base64.b64encode(path.read_bytes()).decode("ascii")
              for index in range(0, len(encoded), 3000):
                  title = path.stem.replace("_preview", "")
                  print(f"::notice title=a006_{title}_{index // 3000}::{encoded[index:index + 3000]}")
          PYCODE
      - name: Preview Assignment 006 views 13–18
        if: always()
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import base64, pathlib
          paths = sorted(pathlib.Path("assignment006-visual-acceptance").glob("*_preview.jpg"))
          for path in paths[12:18]:
              encoded = base64.b64encode(path.read_bytes()).decode("ascii")
              for index in range(0, len(encoded), 3000):
                  title = path.stem.replace("_preview", "")
                  print(f"::notice title=a006_{title}_{index // 3000}::{encoded[index:index + 3000]}")
          PYCODE

  visual-review:
    name: Native-resolution visual review — ${{ matrix.capture }}
    needs: headless
    if: needs.headless.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        capture:
          - 01_initiation_assessment_hall
          - 02_initiation_player_npc
          - 03_meridian_main_environment
          - 04_meridian_interior_lighting
          - 05_tung_chung_station
          - 06_tung_chung_train_platform_and_interior
          - 07_hong_kong_streets
          - 08_hong_kong_commercial_district
          - 09_hong_kong_harbour_skyline
          - 10_hong_kong_characters_disguise
          - 11_ngong_ping_exterior_statue
          - 12_discovered_facility_entrance
          - 13_facility_monumental_interior
          - 14_facility_central_operations
          - 15_facility_vertical_statue_core
          - 16_instinct_target_and_discovered_intel
          - 17_instinct_secret_undiscovered_hidden
          - 18_campaign_hud_gameplay
    steps:
      - name: Download genuine native-resolution capture artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: assignment006-visual-acceptance
          path: assignment006-visual-acceptance
      - name: Expose one full-resolution review image in bounded check annotations
        shell: bash
        env:
          CAPTURE_NAME: ${{ matrix.capture }}
        run: |
          python3 - <<'PYCODE'
          import base64, os, pathlib
          name = os.environ["CAPTURE_NAME"]
          path = pathlib.Path("assignment006-visual-acceptance") / f"{name}_inspect.jpg"
          payload = path.read_bytes()
          if not 0 < len(payload) <= 29900:
              raise SystemExit(f"{path}: payload size {len(payload)} outside 1..29900 bytes")
          encoded = base64.b64encode(payload).decode("ascii")
          # Actions exposes at most ten annotations per check run, and the
          # checks API truncates longer annotation bodies at 4096 characters.
          # This budget guarantees <=10 independently recoverable 4000-char chunks.
          for index in range(0, len(encoded), 4000):
              chunk = encoded[index:index + 4000]
              title = f"a006_native_{name}_{index // 4000:02d}"
              print(f"::notice title={title}::{chunk}")
          PYCODE

  windows:
    if: contains(github.event.head_commit.message, '[windows]')
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download and verify official Godot and export template
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable'
          $engine = 'Godot_v4.4.1-stable_win64.exe.zip'
          $templates = 'Godot_v4.4.1-stable_export_templates.tpz'
          foreach ($file in @('SHA512-SUMS.txt', $engine, $templates)) {
            & curl.exe --fail --location --retry 3 --output "$env:RUNNER_TEMP\$file" "$base/$file"
            if ($LASTEXITCODE -ne 0) { throw "Download failed: $file" }
          }
          foreach ($file in @($engine, $templates)) {
            $line = Get-Content "$env:RUNNER_TEMP\SHA512-SUMS.txt" | Where-Object { $_.Contains($file) } | Select-Object -First 1
            if (!$line) { throw "No official hash found for $file" }
            $expected = ($line -split '\s+')[0]
            $actual = (Get-FileHash "$env:RUNNER_TEMP\$file" -Algorithm SHA512).Hash
            if ($actual -ne $expected) { throw "SHA512 mismatch: $file" }
          }
          Expand-Archive "$env:RUNNER_TEMP\$engine" "$env:RUNNER_TEMP\godot"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $destination = Join-Path $env:APPDATA 'Godot\export_templates\4.4.1.stable'
          New-Item -ItemType Directory -Force $destination | Out-Null
          $archive = [System.IO.Compression.ZipFile]::OpenRead("$env:RUNNER_TEMP\$templates")
          try {
            $entry = $archive.GetEntry('templates/windows_release_x86_64.exe')
            if (!$entry) { throw 'Windows release template missing' }
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $destination 'windows_release_x86_64.exe'), $true)
          } finally { $archive.Dispose() }
      - name: Import and export
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $godot = "$env:RUNNER_TEMP\godot\Godot_v4.4.1-stable_win64_console.exe"
          & $godot --version
          & $godot --headless --path . --import
          if ($LASTEXITCODE -ne 0) { throw 'Import failed' }
          New-Item -ItemType Directory -Force 'build/windows' | Out-Null
          & $godot --headless --path . --export-release Windows "$env:GITHUB_WORKSPACE\build\windows\PROJECT_ASSASSIN.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Export failed' }
      - name: Launch exported scenes headlessly
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = "$env:GITHUB_WORKSPACE\build\windows"
          $scenes = @('main_menu', 'initiation', 'hotel', 'tung_chung_preview', 'hong_kong_preview', 'ngong_ping_preview', 'mission_tung_chung', 'mission_hong_kong_sandbox', 'mission_ngong_ping', 'usb_decryption')
          foreach ($scene in $scenes) {
            $log = "$path\smoke-$scene.log"
            $arguments = @('--headless', '--quit-after', '120', '--log-file', $log, "res://scenes/$scene.tscn")
            $process = Start-Process "$path\PROJECT_ASSASSIN.exe" -WorkingDirectory $path -ArgumentList $arguments -PassThru
            if (!$process.WaitForExit(90000)) { $process.Kill(); throw "$scene timed out" }
            if ($process.ExitCode -ne 0) { throw "$scene exited $($process.ExitCode)" }
            if (!(Test-Path $log)) { throw "No smoke log for $scene" }
            Get-Content $log
            if (Select-String -Path $log -Pattern 'SCRIPT ERROR|ERROR:') { throw "$scene logged errors" }
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: project-assassin-windows-smoke-tested
          path: build/windows/*
          if-no-files-found: error
